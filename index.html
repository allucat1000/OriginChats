<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OriginChats</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.4/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/vs2015.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <meta http-equiv="Content-Security-Policy"
        content="
        default-src 'self';
        script-src 'self' https://cdnjs.cloudflare.com data: blob: 'unsafe-inline';
        style-src 'self' 'unsafe-inline' data: https://cdnjs.cloudflare.com;
        img-src 'self' data: blob: https:;
        font-src 'self' https://cdnjs.cloudflare.com data: blob:;
        connect-src 'self' https: http: wss: ws:;
        media-src 'self' data: blob: https:;
        frame-src * data: blob:;
        worker-src 'self' blob:;
        object-src 'none';
    ">
</head>
<body>
    <div id="topbar">
        <p id="title">Originchats</p>
        <div></div>
        <div id="winControls">
            <button id="viewPins">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-pin-icon lucide-pin"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
            </button>
            <button id="winClose">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-x-icon lucide-x"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            </button>
        </div>
    </div>
    <h2 id="connectionText">Connecting...</h2>
    <div id="main">
        <div id="channelSidebar">
            <div id="serverInfo"></div>
        </div>
        <div id="chatArea">
            <div id="messages"></div>
            <div id="typingIndicator"></div>
            <div id="msgContainer">
                <div id="inputDiv">
                    <textarea placeholder="Open a channel to send messages" rows="1" disabled="true" id="chatInput"></textarea>
                    <div id="inputOptions">
                        
                    </div>
                </div>
            </div>
        </div>
        <div id="userList"></div>
    </div>
    <script src="main.js" type="module"></script>
</body>
</html>
